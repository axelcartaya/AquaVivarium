services:
  aquavivarium-web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=aquavivarium-db;Initial Catalog=AquaVivariumDB;User Id=sa;Password=AquaPassword123!;TrustServerCertificate=True;
    depends_on:
      - aquavivarium-db

  aquavivarium-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1430:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AquaPassword123!
    volumes:
      - ./Database:/scripts
    command: >
      /bin/bash -c "
      /opt/mssql/bin/sqlservr & 
      sleep 20 && 
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AquaPassword123!' -Q 'CREATE DATABASE AquaVivariumDB' -C &&
      /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'AquaPassword123!' -d AquaVivariumDB -i /scripts/init.sql -C && 
      wait"